<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/zuri-icon.png" />
    <link rel="apple-touch-icon" href="/zuri-icon.png" />
    <title>Zuri Studios — Beauty businesses, booked.</title>
    <meta
      name="description"
      content="Zuri Studios is the all-in-one platform for beauty businesses to take online bookings, sell products, accept Mobile Money & card payments, and run loyalty — each on their own branded site."
    />
    <meta name="author" content="Zuri Studios" />

    <meta property="og:title" content="Zuri Studios — Beauty businesses, booked." />
    <meta
      property="og:description"
      content="The all-in-one platform for beauty businesses to take bookings, sell products, accept payments and run loyalty — each on their own branded site."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zuri Studios" />
    <meta property="og:url" content="https://zuristudios.com/" />
    <meta property="og:image" content="https://zuristudios.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zuri Studios — Beauty businesses, booked." />
    <meta
      name="twitter:description"
      content="The all-in-one platform for beauty businesses to take bookings, sell products, accept payments and run loyalty — each on their own branded site."
    />
    <meta name="twitter:image" content="https://zuristudios.com/og-image.jpg" />
    <!-- Loading screen. Plain HTML/CSS so it paints before any JavaScript has
         downloaded; src/lib/splash.ts fades it out once the page is ready. -->
    <style>
      #splash {
        --splash-bg: hsl(20 33% 98%);
        --splash-fg: hsl(340 20% 15%);
        --splash-muted: hsl(340 10% 45% / 0.25);
        --splash-accent: hsl(340 45% 55%);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--splash-bg);
        color: var(--splash-fg);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      html.dark #splash {
        --splash-bg: hsl(340 20% 8%);
        --splash-fg: hsl(340 10% 95%);
        --splash-muted: hsl(340 10% 95% / 0.15);
        --splash-accent: hsl(340 50% 60%);
      }
      #splash.splash-hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-mark {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--splash-accent);
        color: #fff;
        font: 600 28px/1 Lora, Georgia, "Times New Roman", serif;
      }
      #splash .splash-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #splash .splash-mark.splash-plain {
        background: none;
        border-radius: 16px;
      }
      #splash .splash-mark.splash-plain img {
        object-fit: contain;
      }
      #splash .splash-mark:empty {
        display: none;
      }
      #splash .splash-name {
        margin: 0;
        max-width: min(80vw, 420px);
        text-align: center;
        font: 600 22px/1.25 Lora, Georgia, "Times New Roman", serif;
        letter-spacing: -0.01em;
      }
      #splash .splash-name:empty {
        display: none;
      }
      #splash .splash-bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--splash-muted);
      }
      #splash .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--splash-accent);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash .splash-bar::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading">
      <div class="splash-mark" id="splash-mark"></div>
      <p class="splash-name" id="splash-name"></p>
      <div class="splash-bar"></div>
    </div>
    <!-- External, not inline: the Content-Security-Policy (vercel.json) only
         allows same-origin scripts. Loaded synchronously so it runs before
         first paint. -->
    <script src="/splash.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
