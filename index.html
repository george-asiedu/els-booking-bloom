<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/zuri-mark-square.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable app: a studio's site swaps in its own manifest (src/lib/pwa.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fab700" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zuri Studios" />
    <title>Zuri Studios — Your own booking site or online shop, ready today.</title>
    <meta
      name="description"
      content="Zuri Studios gives studios and shops their own website to take bookings, sell products and get paid by Mobile Money or card, with loyalty and reviews built in."
    />
    <meta name="author" content="Zuri Studios" />

    <meta property="og:title" content="Zuri Studios — Your own booking site or online shop, ready today." />
    <meta
      property="og:description"
      content="Zuri Studios gives studios and shops their own website to take bookings, sell products and get paid by Mobile Money or card, with loyalty and reviews built in."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zuri Studios" />
    <meta property="og:url" content="https://zuristudios.com/" />
    <meta property="og:image" content="https://zuristudios.com/zuri-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Zuri Studios logo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zuri Studios — Your own booking site or online shop, ready today." />
    <meta
      name="twitter:description"
      content="Zuri Studios gives studios and shops their own website to take bookings, sell products and get paid by Mobile Money or card, with loyalty and reviews built in."
    />
    <meta name="twitter:image" content="https://zuristudios.com/zuri-og.jpg" />
    <meta name="twitter:image:alt" content="The Zuri Studios logo" />
    <!-- Lets search engines show the Zuri logo beside results. A data block,
         not a script, so the CSP doesn't block it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Zuri Studios",
        "url": "https://zuristudios.com/",
        "logo": "https://zuristudios.com/zuri-logo.png"
      }
    </script>
    <!-- Loading screen. Plain HTML/CSS so it paints before any JavaScript has
         downloaded; src/lib/splash.ts fades it out once the page is ready. -->
    <style>
      #splash {
        --splash-bg: hsl(0 0% 100%);
        --splash-fg: hsl(214 33% 10%);
        --splash-muted: hsl(214 10% 45% / 0.2);
        --splash-accent: hsl(46 100% 49%);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--splash-bg);
        color: var(--splash-fg);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      html.dark #splash {
        --splash-bg: hsl(214 33% 7%);
        --splash-fg: hsl(0 0% 98%);
        --splash-muted: hsl(0 0% 98% / 0.15);
        --splash-accent: hsl(46 100% 49%);
      }
      #splash.splash-hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-mark {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--splash-accent);
        color: #fff;
        font: 600 28px/1 Lora, Georgia, "Times New Roman", serif;
      }
      #splash .splash-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #splash .splash-mark.splash-plain {
        background: none;
        border-radius: 16px;
      }
      #splash .splash-mark.splash-plain img {
        object-fit: contain;
      }
      #splash .splash-mark:empty {
        display: none;
      }
      #splash .splash-name {
        margin: 0;
        max-width: min(80vw, 420px);
        text-align: center;
        font: 600 22px/1.25 Lora, Georgia, "Times New Roman", serif;
        letter-spacing: -0.01em;
      }
      #splash .splash-name:empty {
        display: none;
      }
      #splash .splash-bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--splash-muted);
      }
      #splash .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--splash-accent);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash .splash-bar::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading">
      <div class="splash-mark" id="splash-mark"></div>
      <p class="splash-name" id="splash-name"></p>
      <div class="splash-bar"></div>
    </div>
    <!-- External, not inline: the Content-Security-Policy (vercel.json) only
         allows same-origin scripts. Loaded synchronously so it runs before
         first paint. -->
    <script src="/splash.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
