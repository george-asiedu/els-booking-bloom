name: Deploy production (S3 + CloudFront)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

permissions:
  id-token: write # AWS sign-in without stored keys (OIDC)
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ROOT_DOMAIN: ${{ vars.VITE_ROOT_DOMAIN }}
          # Public by design (it ships in the page). Guest actions need it.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload
        run: |
          # Hashed assets: cache for a year. Everything else: always revalidate.
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete \
            --exclude "index.html" --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" --exclude "splash.js" --exclude "robots.txt" --exclude "sw.js" --exclude "manifest.webmanifest"
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "*" --include "*.html" --include "splash.js" --include "robots.txt" --include "sw.js" --include "manifest.webmanifest" \
            --cache-control "no-cache"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/splash.js" "/sw.js" "/manifest.webmanifest" "/"
